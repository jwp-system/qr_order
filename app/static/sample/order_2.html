<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛있는 식당 - QR 주문</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            hoverBlue: '#1B64DA',
                            lightBlue: '#E8F3FF',
                            dark: '#191F28',
                            gray: '#8B95A1',
                            lightGray: '#F2F4F6',
                            border: '#E5E8EB',
                            bg: '#F9FAFB'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-toss-bg text-toss-dark font-sans antialiased min-h-screen pb-28">

<!-- Header -->
<header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-toss-border/60">
    <div class="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
        <div>
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-tight text-toss-dark">
                    맛있는 식당
                </h1>
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    주문가능
                </span>
            </div>
            <p class="text-xs text-toss-gray mt-0.5 font-medium">
                테이블 <span class="text-toss-dark font-bold">5번</span> • 비대면 간편주문
            </p>
        </div>

        <button class="p-2 text-toss-gray hover:text-toss-dark rounded-xl hover:bg-toss-lightGray transition">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </button>
    </div>

    <!-- Category Nav (모바일/태블릿 가로 스크롤) -->
    <div class="max-w-5xl mx-auto px-5 pb-3">
        <nav class="flex gap-2 overflow-x-auto no-scrollbar scroll-smooth">
            <button class="whitespace-nowrap px-4 py-2 rounded-2xl bg-toss-dark text-white text-sm font-semibold shadow-sm transition active:scale-95">
                전체
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-2xl bg-white border border-toss-border/80 text-toss-dark text-sm font-medium hover:bg-slate-50 transition active:scale-95">
                메인메뉴
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-2xl bg-white border border-toss-border/80 text-toss-dark text-sm font-medium hover:bg-slate-50 transition active:scale-95">
                세트메뉴
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-2xl bg-white border border-toss-border/80 text-toss-dark text-sm font-medium hover:bg-slate-50 transition active:scale-95">
                사이드
            </button>
            <button class="whitespace-nowrap px-4 py-2 rounded-2xl bg-white border border-toss-border/80 text-toss-dark text-sm font-medium hover:bg-slate-50 transition active:scale-95">
                음료/주류
            </button>
        </nav>
    </div>
</header>

<!-- Main Container -->
<main class="max-w-5xl mx-auto px-5 pt-6 space-y-8">

    <!-- Section: 인기 메뉴 -->
    <section>
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-toss-dark">인기 메뉴</h2>
            <span class="text-xs text-toss-gray">가장 많이 주문하고 있어요</span>
        </div>

        <!-- Menu Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

            <!-- Card 1 -->
            <div class="bg-white rounded-3xl overflow-hidden border border-toss-border/60 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                <div class="relative overflow-hidden aspect-[16/10] bg-slate-100">
                    <img 
                        src="https://images.unsplash.com/photo-1552611052-33e04de081de?w=600&auto=format&fit=crop&q=80" 
                        alt="비빔냉면"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    />
                    <span class="absolute top-3 left-3 bg-toss-blue text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm">
                        대표
                    </span>
                </div>

                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-bold text-toss-dark">비빔냉면</h3>
                        <p class="text-sm text-toss-gray mt-1 leading-snug line-clamp-2">
                            자가제면한 쫄깃한 면발과 특제 비빔 양념장의 매콤달콤한 조화
                        </p>
                    </div>

                    <div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-100">
                        <span class="text-xl font-extrabold text-toss-dark">9,000원</span>
                        <button class="px-4 py-2 rounded-xl bg-toss-lightBlue hover:bg-blue-100 active:scale-95 text-toss-blue font-bold text-sm transition">
                            담기
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-3xl overflow-hidden border border-toss-border/60 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                <div class="relative overflow-hidden aspect-[16/10] bg-slate-100">
                    <img 
                        src="https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop&q=80" 
                        alt="돈까스"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    />
                    <span class="absolute top-3 left-3 bg-rose-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm">
                        인기
                    </span>
                </div>

                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-bold text-toss-dark">수제 돈까스</h3>
                        <p class="text-sm text-toss-gray mt-1 leading-snug line-clamp-2">
                            국내산 생등심을 저온 숙성해 바삭하게 튀겨낸 클래식 돈까스
                        </p>
                    </div>

                    <div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-100">
                        <span class="text-xl font-extrabold text-toss-dark">11,000원</span>
                        <button class="px-4 py-2 rounded-xl bg-toss-lightBlue hover:bg-blue-100 active:scale-95 text-toss-blue font-bold text-sm transition">
                            담기
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="bg-white rounded-3xl overflow-hidden border border-toss-border/60 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                <div class="relative overflow-hidden aspect-[16/10] bg-slate-100">
                    <img 
                        src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600&auto=format&fit=crop&q=80" 
                        alt="물냉면"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                    />
                </div>

                <div class="p-5 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-lg font-bold text-toss-dark">물냉면</h3>
                        <p class="text-sm text-toss-gray mt-1 leading-snug line-clamp-2">
                            직접 끓인 동치미 육수의 깊고 개운한 감칠맛
                        </p>
                    </div>

                    <div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-100">
                        <span class="text-xl font-extrabold text-toss-dark">9,000원</span>
                        <button class="px-4 py-2 rounded-xl bg-toss-lightBlue hover:bg-blue-100 active:scale-95 text-toss-blue font-bold text-sm transition">
                            담기
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<!-- Floating Cart Bar (하단 플로팅 장바구니) -->
<div class="fixed bottom-0 inset-x-0 p-4 z-50 pointer-events-none">
    <div class="max-w-md mx-auto pointer-events-auto">
        <button class="w-full bg-toss-blue hover:bg-toss-hoverBlue active:scale-[0.98] text-white rounded-2xl p-4 shadow-xl shadow-toss-blue/30 flex items-center justify-between transition-all">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm">
                    3
                </div>
                <div class="text-left">
                    <p class="text-xs text-blue-100 font-medium">담은 메뉴 보기</p>
                    <p class="text-base font-bold">장바구니 확인</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 font-extrabold text-lg">
                <span>29,000원</span>
                <svg class="w-5 h-5 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </button>
    </div>
</div>

<style>
    /* 가로 스크롤바 숨김 처리 */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
</style>

</body>
</html>
