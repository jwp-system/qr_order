<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Order Admin - 취소 내역 포함</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            hoverBlue: '#1B64DA',
                            lightBlue: '#E8F3FF',
                            dark: '#191F28',
                            gray: '#8B95A1',
                            lightGray: '#F2F4F6',
                            border: '#E5E8EB',
                            bg: '#F9FAFB',
                            red: '#F04452',
                            lightRed: '#FEECEE',
                            orange: '#FF8800',
                            lightOrange: '#FFF3E5',
                            green: '#04B066',
                            lightGreen: '#E6F8F0'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-toss-bg text-toss-dark font-sans antialiased min-h-screen relative overflow-x-hidden">

<!-- 🔔 토스 스타일 플로팅 토스트 -->
<div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-toss-border/60 shrink-0 select-none">
        <div class="px-6 py-7">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-toss-blue flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-toss-blue/30">
                    Q
                </div>
                <h1 class="text-xl font-bold tracking-tight text-toss-dark">
                    QR Order
                </h1>
            </div>
            <div class="mt-4 flex items-center justify-between p-3 bg-toss-bg rounded-xl">
                <div>
                    <p class="text-xs text-toss-gray font-medium">현재 매장</p>
                    <p class="text-sm font-semibold text-toss-dark">맛있는 식당 강남점</p>
                </div>
                <span class="inline-flex w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-50"></span>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-toss-lightBlue text-toss-blue font-semibold transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                주문 관리
                <span id="nav-new-badge" class="ml-auto bg-toss-blue text-white text-xs font-bold px-2 py-0.5 rounded-full">2</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-toss-gray hover:text-toss-dark hover:bg-toss-lightGray/60 font-medium transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                통계 분석
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">

        <!-- Top Header -->
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-20 px-8 py-5 border-b border-toss-border/60 flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-toss-dark">
                    주문 현황
                </h2>
                <p id="header-status-text" class="text-sm text-toss-gray mt-0.5 font-medium">
                    새로운 주문을 확인해주세요.
                </p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="simulateIncomingOrder()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-toss-lightBlue hover:bg-blue-100 text-toss-blue font-bold text-xs transition active:scale-95 shadow-sm">
                    <span>⚡ 가상 신규주문 발생</span>
                </button>

                <div class="h-5 w-[1px] bg-toss-border"></div>

                <div class="flex items-center gap-2 text-sm font-medium text-toss-gray">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    실시간 알림 켜짐
                </div>
            </div>
        </header>

        <!-- Body Container -->
        <div class="p-8 max-w-7xl mx-auto w-full space-y-6">

            <!-- KPI Cards -->
            <section class="grid grid-cols-2 lg:grid-cols-5 gap-3.5">
                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-toss-blue transition" onclick="switchTab('ALL')">
                    <span class="text-xs font-semibold text-toss-gray">전체 접수</span>
                    <div class="text-2xl font-black text-toss-dark mt-2 tracking-tight" id="kpi-total">5건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border-2 border-toss-blue/30 shadow-sm cursor-pointer hover:border-toss-blue transition" onclick="switchTab('NEW')">
                    <span class="text-xs font-semibold text-toss-blue">신규 주문</span>
                    <div class="text-2xl font-black text-toss-blue mt-2 tracking-tight" id="kpi-new">2건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-amber-400 transition" onclick="switchTab('COOKING')">
                    <span class="text-xs font-semibold text-toss-orange">조리 중</span>
                    <div class="text-2xl font-black text-toss-orange mt-2 tracking-tight" id="kpi-cooking">1건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-emerald-400 transition" onclick="switchTab('DONE')">
                    <span class="text-xs font-semibold text-toss-green">완료</span>
                    <div class="text-2xl font-black text-toss-green mt-2 tracking-tight" id="kpi-done">1건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-red-400 transition" onclick="switchTab('CANCEL')">
                    <span class="text-xs font-semibold text-toss-red">취소 / 거절</span>
                    <div class="text-2xl font-black text-toss-red mt-2 tracking-tight" id="kpi-cancel">1건</div>
                </div>
            </section>

            <!-- Segmented Filter Tab -->
            <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                <div class="inline-flex p-1 bg-slate-200/60 rounded-2xl w-full sm:w-auto shadow-inner overflow-x-auto">
                    <button onclick="switchTab('ALL')" id="tab-ALL" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-toss-dark shadow-sm whitespace-nowrap">
                        전체 <span id="badge-all" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightGray text-toss-gray font-bold">5</span>
                    </button>
                    <button onclick="switchTab('NEW')" id="tab-NEW" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark whitespace-nowrap">
                        신규 <span id="badge-new" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightBlue text-toss-blue font-bold">2</span>
                    </button>
                    <button onclick="switchTab('COOKING')" id="tab-COOKING" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark whitespace-nowrap">
                        조리중 <span id="badge-cooking" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightOrange text-toss-orange font-bold">1</span>
                    </button>
                    <button onclick="switchTab('DONE')" id="tab-DONE" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark whitespace-nowrap">
                        완료 <span id="badge-done" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightGreen text-toss-green font-bold">1</span>
                    </button>
                    <button onclick="switchTab('CANCEL')" id="tab-CANCEL" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark whitespace-nowrap">
                        취소 <span id="badge-cancel" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightRed text-toss-red font-bold">1</span>
                    </button>
                </div>
            </section>

            <!-- Order Cards Container -->
            <section class="space-y-4">
                <div id="order-container" class="space-y-4"></div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-toss-border">
                    <p class="text-4xl mb-3">🍃</p>
                    <h4 class="text-lg font-bold text-toss-dark">해당 상태의 내역이 없습니다</h4>
                    <p class="text-sm text-toss-gray mt-1">상태 필터를 바꾸거나 새로운 주문을 기다려주세요.</p>
                </div>
            </section>

        </div>
    </main>
</div>

<script>
    // Web Audio API 사운드
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playOrderChime() {
        try {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(698.46, now);
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.3, now + 0.04);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.45);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880.00, now + 0.16);
            gain2.gain.setValueAtTime(0, now + 0.16);
            gain2.gain.linearRampToValueAtTime(0.35, now + 0.20);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.16);
            osc2.stop(now + 0.8);
        } catch(e) {
            console.warn(e);
        }
    }

    function showNotificationToast(order) {
        const toastContainer = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto bg-white rounded-2xl p-4 shadow-xl border border-toss-border/80 flex items-center gap-3.5 w-80 transform translate-y-[-20px] opacity-0 transition-all duration-300 ease-out cursor-pointer hover:shadow-2xl';
        
        toast.innerHTML = `
            <div class="w-10 h-10 rounded-xl bg-toss-lightBlue flex items-center justify-center text-toss-blue shrink-0">
                <svg class="w-5 h-5 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                    <h5 class="text-xs font-bold text-toss-blue">새 주문 도착</h5>
                    <span class="text-[11px] text-toss-gray">방금</span>
                </div>
                <p class="text-sm font-bold text-toss-dark truncate mt-0.5">${order.table} • ${order.items[0].name}${order.items.length > 1 ? ` 외 ${order.items.length - 1}개` : ''}</p>
                <p class="text-xs text-toss-gray font-medium mt-0.5">${order.totalPrice} 결제완료</p>
            </div>
        `;

        toast.onclick = () => {
            switchTab('NEW');
            const targetEl = document.querySelector(`[data-id="${order.id}"]`);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.add('ring-2', 'ring-toss-blue');
                setTimeout(() => targetEl.classList.remove('ring-2', 'ring-toss-blue'), 1800);
            }
            dismissToast(toast);
        };

        toastContainer.appendChild(toast);
        requestAnimationFrame(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'));
        setTimeout(() => dismissToast(toast), 4000);
    }

    function dismissToast(toast) {
        if (!toast || !toast.parentNode) return;
        toast.classList.add('opacity-0', 'translate-x-10');
        setTimeout(() => toast.remove(), 250);
    }

    // 주문 데이터 (CANCEL 상태 포함)
    let orders = [
        {
            id: 104,
            table: '5번 테이블',
            time: '방금 전',
            status: 'NEW',
            payType: 'QR 토스페이',
            totalPrice: '27,000원',
            items: [
                { name: '비빔냉면', qty: 2 },
                { name: '돈까스 (매운맛)', qty: 1 }
            ]
        },
        {
            id: 105,
            table: '2번 테이블',
            time: '2분 전',
            status: 'NEW',
            payType: '카드 결제',
            totalPrice: '9,000원',
            items: [
                { name: '물냉면', qty: 1 }
            ]
        },
        {
            id: 102,
            table: '8번 테이블',
            time: '12분 전',
            status: 'COOKING',
            payType: '카카오페이',
            totalPrice: '34,000원',
            items: [
                { name: '치즈 돈까스', qty: 2 },
                { name: '콜라 355ml', qty: 2 }
            ]
        },
        {
            id: 101,
            table: '1번 테이블',
            time: '25분 전',
            status: 'DONE',
            payType: 'QR 토스페이',
            totalPrice: '18,000원',
            items: [
                { name: '비빔냉면', qty: 2 }
            ]
        },
        {
            id: 100,
            table: '4번 테이블',
            time: '34분 전',
            status: 'CANCEL',
            cancelReason: '고객 단순 변심 및 재주문',
            payType: 'QR 토스페이 (환불완료)',
            totalPrice: '13,000원',
            items: [
                { name: '치즈 돈까스', qty: 1 }
            ]
        }
    ];

    let currentFilter = 'ALL';
    let nextOrderId = 106;

    function simulateIncomingOrder() {
        const dummyTables = ['3번 테이블', '7번 테이블', 'VIP 룸', '창가 1번', '9번 테이블'];
        const dummyMenus = [
            [{ name: '치즈 돈까스', qty: 1 }, { name: '제로콜라', qty: 1 }],
            [{ name: '비빔냉면 (곱빼기)', qty: 2 }],
            [{ name: '물냉면', qty: 1 }, { name: '왕만두(4알)', qty: 1 }]
        ];
        const prices = ['16,500원', '22,000원', '14,000원'];
        const randIdx = Math.floor(Math.random() * dummyMenus.length);

        const newOrder = {
            id: nextOrderId++,
            table: dummyTables[Math.floor(Math.random() * dummyTables.length)],
            time: '방금 전',
            status: 'NEW',
            payType: 'QR 토스페이',
            totalPrice: prices[randIdx],
            items: dummyMenus[randIdx],
            isNewArrival: true
        };

        orders.unshift(newOrder);
        playOrderChime();
        showNotificationToast(newOrder);
        updateBadgesAndKPI();
        renderOrders();
    }

    function switchTab(status) {
        currentFilter = status;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.className = 'tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark whitespace-nowrap';
        });

        const activeBtn = document.getElementById(`tab-${status}`);
        if (activeBtn) {
            activeBtn.className = 'tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-toss-dark shadow-sm whitespace-nowrap';
        }
        renderOrders();
    }

    // 거절/취소 처리 로직 (삭제하지 않고 CANCEL 상태로 변경)
    function changeOrderStatus(orderId, newStatus, btnElement) {
        const card = btnElement.closest('.order-card');
        if (card) {
            card.style.transform = 'scale(0.97)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                const target = orders.find(o => o.id === orderId);
                if (target) {
                    target.status = newStatus;
                    target.isNewArrival = false;
                    if (newStatus === 'CANCEL') {
                        target.cancelReason = '매장 사정 / 주문 취소';
                        target.payType = target.payType.includes('환불') ? target.payType : target.payType + ' (환불완료)';
                    }
                }
                updateBadgesAndKPI();
                renderOrders();
            }, 200);
        }
    }

    function getStatusBadge(status) {
        switch(status) {
            case 'NEW':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightBlue text-toss-blue">신규 주문</span>';
            case 'COOKING':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightOrange text-toss-orange">조리 중</span>';
            case 'DONE':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightGreen text-toss-green">서빙 완료</span>';
            case 'CANCEL':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightRed text-toss-red">주문 취소</span>';
        }
    }

    function getActionButtons(order) {
        if (order.status === 'NEW') {
            return `
                <button onclick="changeOrderStatus(${order.id}, 'COOKING', this)" class="flex-1 px-5 py-3 rounded-2xl bg-toss-blue hover:bg-toss-hoverBlue active:scale-95 text-white font-semibold text-sm transition-all shadow-sm shadow-toss-blue/20">
                    주문 수락
                </button>
                <button onclick="changeOrderStatus(${order.id}, 'CANCEL', this)" class="px-5 py-3 rounded-2xl bg-toss-lightGray hover:bg-red-50 hover:text-toss-red active:scale-95 text-toss-gray font-medium text-sm transition-all">
                    거절/취소
                </button>
            `;
        } else if (order.status === 'COOKING') {
            return `
                <button onclick="changeOrderStatus(${order.id}, 'DONE', this)" class="flex-1 px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-sm transition-all shadow-sm shadow-emerald-600/20">
                    조리 완료
                </button>
                <button onclick="changeOrderStatus(${order.id}, 'CANCEL', this)" class="px-4 py-3 rounded-2xl bg-toss-lightGray hover:bg-red-50 hover:text-toss-red active:scale-95 text-toss-gray font-medium text-xs transition-all">
                    취소
                </button>
            `;
        } else if (order.status === 'DONE') {
            return `
                <span class="px-5 py-3 rounded-2xl bg-toss-lightGray text-toss-gray font-medium text-sm text-center">
                    완료된 주문
                </span>
            `;
        } else { // CANCEL
            return `
                <div class="text-right sm:text-center">
                    <span class="inline-block px-4 py-2.5 rounded-2xl bg-toss-lightRed text-toss-red font-semibold text-xs">
                        취소 및 환불 완료
                    </span>
                </div>
            `;
        }
    }

    function renderOrders() {
        const container = document.getElementById('order-container');
        const emptyState = document.getElementById('empty-state');

        const filtered = orders.filter(order => {
            if (currentFilter === 'ALL') return true;
            return order.status === currentFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');

        container.innerHTML = filtered.map(order => {
            const isCancel = order.status === 'CANCEL';

            return `
                <div class="order-card bg-white rounded-3xl p-6 border ${isCancel ? 'border-red-100 bg-red-50/20 opacity-80' : (order.isNewArrival ? 'border-toss-blue ring-2 ring-toss-blue/20' : 'border-toss-border/70')} shadow-sm transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-6" data-id="${order.id}">
                    <div class="flex-1 space-y-3">
                        <div class="flex items-center gap-3">
                            ${getStatusBadge(order.status)}
                            <span class="text-xs font-bold text-toss-gray">#${order.id}</span>
                            <span class="text-sm font-medium text-toss-gray">${order.time}</span>
                            ${isCancel && order.cancelReason ? `<span class="text-xs text-toss-red bg-toss-lightRed px-2 py-0.5 rounded-md font-medium">사유: ${order.cancelReason}</span>` : ''}
                        </div>

                        <h4 class="text-2xl font-bold ${isCancel ? 'text-slate-400 line-through' : 'text-toss-dark'} tracking-tight">
                            ${order.table}
                        </h4>

                        <div class="p-4 ${isCancel ? 'bg-white/80' : 'bg-toss-bg'} rounded-2xl space-y-2 border border-slate-100">
                            ${order.items.map(item => `
                                <div class="flex justify-between items-center text-sm font-medium ${isCancel ? 'text-slate-400' : 'text-toss-dark'}">
                                    <span class="${isCancel ? 'line-through' : ''}">${item.name}</span>
                                    <span class="font-bold ${isCancel ? 'text-slate-400 bg-slate-100' : 'text-toss-blue bg-white'} px-2 py-0.5 rounded-md border border-slate-200">${item.qty}개</span>
                                </div>
                            `).join('')}
                            <div class="pt-2 mt-2 border-t border-slate-200 flex justify-between items-center text-xs text-toss-gray">
                                <span>${order.payType}</span>
                                <span class="font-bold text-sm ${isCancel ? 'text-slate-400 line-through' : 'text-toss-dark'}">${order.totalPrice}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex md:flex-col gap-2.5 sm:min-w-[140px] shrink-0">
                        ${getActionButtons(order)}
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateBadgesAndKPI() {
        const countAll = orders.length;
        const countNew = orders.filter(o => o.status === 'NEW').length;
        const countCooking = orders.filter(o => o.status === 'COOKING').length;
        const countDone = orders.filter(o => o.status === 'DONE').length;
        const countCancel = orders.filter(o => o.status === 'CANCEL').length;

        // KPI 숫자 동기화
        document.getElementById('kpi-total').innerText = `${countAll}건`;
        document.getElementById('kpi-new').innerText = `${countNew}건`;
        document.getElementById('kpi-cooking').innerText = `${countCooking}건`;
        document.getElementById('kpi-done').innerText = `${countDone}건`;
        document.getElementById('kpi-cancel').innerText = `${countCancel}건`;

        // 탭 배지 숫자 동기화
        document.getElementById('badge-all').innerText = countAll;
        document.getElementById('badge-new').innerText = countNew;
        document.getElementById('badge-cooking').innerText = countCooking;
        document.getElementById('badge-done').innerText = countDone;
        document.getElementById('badge-cancel').innerText = countCancel;

        // 사이드바
        document.getElementById('nav-new-badge').innerText = countNew;

        // 안내문구
        document.getElementById('header-status-text').innerText = countNew > 0 
            ? `신규 주문이 ${countNew}건 대기 중입니다.` 
            : '대기 중인 신규 주문이 없습니다.';
    }

    // 초기 실행
    updateBadgesAndKPI();
    renderOrders();
</script>

</body>
</html>
