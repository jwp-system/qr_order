<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Order Admin</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            hoverBlue: '#1B64DA',
                            lightBlue: '#E8F3FF',
                            dark: '#191F28',
                            gray: '#8B95A1',
                            lightGray: '#F2F4F6',
                            border: '#E5E8EB',
                            bg: '#F9FAFB',
                            red: '#F04452',
                            lightRed: '#FEECEE'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-toss-bg text-toss-dark font-sans antialiased min-h-screen">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-toss-border/60 shrink-0 select-none">
        <!-- Logo / Store Info -->
        <div class="px-6 py-7">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-toss-blue flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-toss-blue/30">
                    Q
                </div>
                <h1 class="text-xl font-bold tracking-tight text-toss-dark">
                    QR Order
                </h1>
            </div>
            <div class="mt-4 flex items-center justify-between p-3 bg-toss-bg rounded-xl">
                <div>
                    <p class="text-xs text-toss-gray font-medium">현재 매장</p>
                    <p class="text-sm font-semibold text-toss-dark">맛있는 식당 강남점</p>
                </div>
                <span class="inline-flex w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-50"></span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-toss-lightBlue text-toss-blue font-semibold transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                주문 관리
                <span class="ml-auto bg-toss-blue text-white text-xs font-bold px-2 py-0.5 rounded-full">5</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-toss-gray hover:text-toss-dark hover:bg-toss-lightGray/60 font-medium transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                통계 분석
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-toss-gray hover:text-toss-dark hover:bg-toss-lightGray/60 font-medium transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
                메뉴 설정
            </a>
        </nav>

        <!-- Profile/Footer -->
        <div class="p-4 border-t border-toss-border/60">
            <button class="w-full flex items-center justify-between px-3 py-2 text-sm text-toss-gray hover:text-toss-dark rounded-xl transition">
                <span>영업 마감하기</span>
                <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">

        <!-- Top Header -->
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 px-8 py-6 border-b border-toss-border/60 flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-toss-dark">
                    실시간 주문 현황
                </h2>
                <p class="text-sm text-toss-gray mt-1 font-medium">
                    새로운 주문이 5건 대기 중입니다.
                </p>
            </div>
            <div class="flex items-center gap-3">
                <button class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-toss-lightGray hover:bg-slate-200/80 text-toss-dark text-sm font-semibold transition active:scale-95">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    새로고침
                </button>
                <div class="h-6 w-[1px] bg-toss-border"></div>
                <div class="flex items-center gap-2 text-sm font-medium text-toss-gray">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    자동 접수 켜짐
                </div>
            </div>
        </header>

        <!-- Body Container -->
        <div class="p-8 max-w-7xl mx-auto w-full space-y-8">

            <!-- KPI Metric Cards -->
            <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                
                <!-- Metric 1 -->
                <div class="bg-white rounded-3xl p-6 border border-toss-border/60 shadow-sm transition-all hover:shadow-md hover:border-slate-300">
                    <span class="text-sm font-medium text-toss-gray">오늘 총 주문</span>
                    <div class="flex items-baseline justify-between mt-3">
                        <span class="text-3xl font-extrabold text-toss-dark tracking-tight">38건</span>
                        <span class="text-xs font-semibold text-toss-gray bg-toss-lightGray px-2.5 py-1 rounded-full">전체 누적</span>
                    </div>
                </div>

                <!-- Metric 2 (Highlight: New) -->
                <div class="bg-white rounded-3xl p-6 border-2 border-toss-blue/20 bg-gradient-to-br from-white to-blue-50/20 shadow-sm transition-all hover:shadow-md hover:border-toss-blue/40">
                    <span class="text-sm font-semibold text-toss-blue">신규 주문 대기</span>
                    <div class="flex items-baseline justify-between mt-3">
                        <span class="text-3xl font-extrabold text-toss-blue tracking-tight">5건</span>
                        <span class="text-xs font-bold text-toss-blue bg-toss-lightBlue px-2.5 py-1 rounded-full animate-pulse">확인 필요</span>
                    </div>
                </div>

                <!-- Metric 3 -->
                <div class="bg-white rounded-3xl p-6 border border-toss-border/60 shadow-sm transition-all hover:shadow-md hover:border-slate-300">
                    <span class="text-sm font-medium text-toss-gray">조리 중</span>
                    <div class="flex items-baseline justify-between mt-3">
                        <span class="text-3xl font-extrabold text-amber-500 tracking-tight">7건</span>
                        <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">주방 전달됨</span>
                    </div>
                </div>

                <!-- Metric 4 -->
                <div class="bg-white rounded-3xl p-6 border border-toss-border/60 shadow-sm transition-all hover:shadow-md hover:border-slate-300">
                    <span class="text-sm font-medium text-toss-gray">서빙 완료</span>
                    <div class="flex items-baseline justify-between mt-3">
                        <span class="text-3xl font-extrabold text-emerald-600 tracking-tight">26건</span>
                        <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">정상 처리</span>
                    </div>
                </div>

            </section>

            <!-- Order Feed Section -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <h3 class="text-xl font-bold text-toss-dark">신규 주문 리스트</h3>
                        <span class="text-xs font-bold text-toss-blue bg-toss-lightBlue px-2.5 py-1 rounded-full">5</span>
                    </div>
                    <div class="flex gap-2">
                        <button class="text-sm font-medium text-toss-gray hover:text-toss-dark px-3 py-1.5 rounded-lg hover:bg-white transition">최신순</button>
                    </div>
                </div>

                <!-- Order Card Item -->
                <div class="bg-white rounded-3xl p-6 border border-toss-border/70 shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row md:items-center justify-between gap-6">
                    
                    <!-- Left: Table & Items -->
                    <div class="flex-1 space-y-3">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightBlue text-toss-blue">
                                주문번호 #104
                            </span>
                            <span class="text-sm font-medium text-toss-gray">
                                방금 전 (16:21)
                            </span>
                        </div>

                        <div>
                            <h4 class="text-2xl font-bold text-toss-dark tracking-tight">
                                5번 테이블
                            </h4>
                        </div>

                        <!-- Menu Items -->
                        <div class="p-4 bg-toss-bg rounded-2xl space-y-2 border border-slate-100">
                            <div class="flex justify-between items-center text-sm font-medium text-toss-dark">
                                <span>비빔냉면</span>
                                <span class="font-bold text-toss-blue bg-white px-2 py-0.5 rounded-md border border-slate-200">2개</span>
                            </div>
                            <div class="flex justify-between items-center text-sm font-medium text-toss-dark">
                                <span>돈까스 (매운맛)</span>
                                <span class="font-bold text-toss-blue bg-white px-2 py-0.5 rounded-md border border-slate-200">1개</span>
                            </div>
                            <div class="pt-2 mt-2 border-t border-slate-200 flex justify-between items-center text-xs text-toss-gray">
                                <span>결제 완료 (QR 토스페이)</span>
                                <span class="font-bold text-sm text-toss-dark">27,000원</span>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Action Buttons -->
                    <div class="flex md:flex-col gap-2.5 sm:min-w-[140px] shrink-0">
                        <button class="flex-1 px-5 py-3.5 rounded-2xl bg-toss-blue hover:bg-toss-hoverBlue active:scale-[0.98] text-white font-semibold text-sm transition-all shadow-sm shadow-toss-blue/20">
                            주문 수락
                        </button>
                        <button class="px-5 py-3.5 rounded-2xl bg-toss-lightGray hover:bg-slate-200 active:scale-[0.98] text-toss-gray hover:text-toss-dark font-medium text-sm transition-all">
                            거절/취소
                        </button>
                    </div>

                </div>

            </section>

        </div>

    </main>

</div>

</body>
</html>
