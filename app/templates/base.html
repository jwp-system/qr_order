<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}QuickOrder{% endblock %}</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { touch-action: manipulation; }
        [x-cloak] { display: none !important; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 antialiased min-h-screen flex flex-col">
    {% block header %}{% endblock %}

    <!-- 기존 max-w-md md:max-w-4xl 대신 w-full로 확장 -->
    <main class="flex-1 w-full p-4">
        {% block content %}{% endblock %}
    </main>

    <div id="modal-container"></div>
    {% block footer %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
