<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    {% for order in orders %}
        {% include "kitchen/fragments/kitchen_ticket.html" %}
    {% else %}
        <div class="col-span-full py-24 text-center bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
            </div>
            <p class="text-base font-bold text-gray-500">현재 조리 대기 중인 주문이 없습니다.</p>
            <p class="text-xs text-gray-400 mt-1">관리자가 주문을 확정하면 여기에 티켓이 자동으로 나타납니다.</p>
        </div>
    {% endfor %}
</div>
