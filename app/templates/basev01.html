<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}QuickOrder{% endblock %}</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX Core & SSE Extension -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>

    <style>
        /* 모바일 터치 하이라이트 제거 및 부드러운 스크롤 */
        * { -webkit-tap-highlight-color: transparent; }
        body { touch-action: manipulation; }
        [x-cloak] { display: none !important; }
    </style>
    {% block head %}{% endblock %}
</head>
<!-- <body class="bg-gray-100 text-gray-900 antialiased min-h-screen flex flex-col"> -->
<body class="bg-[#F9FAFB] text-[#191F28] antialiased selection:bg-blue-100" 
      x-data="{ cartCount: 2, cartTotal: 24000, showModal: false }">
    <!-- 상단 헤더 / 네비게이션 영역 -->
    {% block header %}{% endblock %}

    <!-- 본문 콘텐츠 영역 -->
    <main class="flex-1 w-full max-w-md md:max-w-4xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <!-- 동적 모달 렌더링 컨테이너 -->
    <div id="modal-container"></div>

    <!-- 하단 푸터 / 플로팅 바 -->
    {% block footer %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
