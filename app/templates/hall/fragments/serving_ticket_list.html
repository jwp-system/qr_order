<!-- app/templates/hall/fragments/serving_ticket_list.html -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for order in orders %}
        {% include "hall/fragments/serving_ticket.html" %}
    {% else %}
        <div class="col-span-full py-24 text-center bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-3 text-emerald-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <p class="text-base font-bold text-gray-500">현재 서빙 대기 중인 주문이 없습니다.</p>
            <p class="text-xs text-gray-400 mt-1">주방에서 조리가 완료되면 서빙 카드가 자동으로 표시됩니다.</p>
        </div>
    {% endfor %}
</div>
