<!-- app/templates/store_admin/fragments/order_list.html -->
<div id="order-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    {% if orders %}
        {% for order in orders %}
            {% include "store_admin/fragments/order_card.html" %}
        {% endfor %}
    {% else %}
        <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-dashed border-gray-300">
            <p class="text-sm font-semibold text-gray-400">현재 대기 중인 주문이 없습니다.</p>
        </div>
    {% endif %}
</div>
