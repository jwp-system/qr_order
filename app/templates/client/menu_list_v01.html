<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주문하기 | QuickOrder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F9FAFB] text-[#191F28] antialiased selection:bg-blue-100"
      @add-to-cart.window="addToCart($event.detail)"
      x-data="cartData()">

    <!-- 모바일 컨테이너 (최대 480px 중앙 정렬) -->
    <div class="max-w-[480px] mx-auto min-h-screen bg-white flex flex-col pb-28 shadow-sm">
        
        <!-- 상단 헤더: 매장 및 테이블 인디케이터 -->
        <header class="sticky top-0 bg-white/90 backdrop-blur-md z-20 px-5 pt-4 pb-3 border-b border-[#F2F4F6]">
            <div class="flex items-center justify-between">
                <div>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-[#3182F6]">
                        테이블 {{table.table_number}}번
                    </span>
                    <h1 class="text-xl font-bold tracking-tight text-[#191F28] mt-1">{{store.name}}</h1>
                </div>
                <div class="text-right">
                    <span class="text-xs text-[#8B95A1] block font-medium">직원 호출</span>
                </div>
            </div>

            <!-- 카테고리 가로 스크롤 칩 (Toss Style) -->
            <nav class="flex gap-2 mt-4 overflow-x-auto no-scrollbar py-1">
                <button type="button"
                    class="px-4 py-2 rounded-xl text-sm font-semibold shrink-0 transition"
                    :class="currentCategory == '0'
                        ? 'bg-[#191F28] text-white shadow-sm'
                        : 'bg-[#F2F4F6] text-[#4E5968] hover:bg-[#E5E8EB]'"
                    @click="setCategory('0')"
                >전체</button>
                {% for cat in categories %}
                <button type="button"
                    class="px-4 py-2 rounded-xl text-sm font-semibold shrink-0 transition"
                    :class="currentCategory == '{{ cat.id }}'
                        ? 'bg-[#191F28] text-white shadow-sm'
                        : 'bg-[#F2F4F6] text-[#4E5968] hover:bg-[#E5E8EB]'"
                    @click="setCategory('{{ cat.id }}')">{{ cat.name }}</button>
                {% endfor %}
            </nav>
        </header>

        <!-- 메뉴 목록 -->
        <main class="flex-1 px-5 pt-4 space-y-4">

            <!-- 메뉴 아이템 -->
             {% for cat in categories %}
             {% for item in cat.items %}
            <article 
                class="flex items-center justify-between p-4 rounded-2xl"
                :class="'{{item.is_sold_out}}' == 'True' ? 'bg-[#FAFAFA] border border-[#EEEEEE] opacity-60 cursor-not-allowed' 
                                            : 'bg-white border border-[#F2F4F6] shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-[0.98] transition cursor-pointer'"
                x-show="currentCategory == '0' || currentCategory == '{{ cat.id }}'"
                hx-get="/items/{{ item.id }}/modal" 
                hx-target="#modal-container" 
                @click="showModal = true">
                <div class="flex-1 pr-3">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span 
                            class="text-[11px] font-bold text-[#E84057] bg-rose-50 px-1.5 py-0.5 rounded-md"
                            x-show="{{item.display_order}} == 0"
                        >인기</span>
                        <h2 class="text-base font-bold text-[#191F28]">{{ item.name }}</h2>
                    </div>
                    <p class="text-xs text-[#8B95A1] line-clamp-2 leading-relaxed">{{ item.description }}</p>
                    <span class="text-base font-bold text-[#191F28] mt-2 block">{{ "{:,}".format(item.price) }}</span>
                </div>
                <div class="w-20 h-20 bg-gray-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center text-gray-300 font-bold text-xs">
                    IMAGE
                </div>
            </article>
            {% endfor %}
            {% endfor %}
        </main>
        <!-- 하단 플로팅 장바구니 바 -->
        <div x-show="cartCount > 0" 
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-8"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-cloak
            class="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-40"
            hx-get="/static/client/show_cart_modal.html"
            hx-target="#modal-container"
            >
            <button type="button"
                    @click="showCartModal = true"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl shadow-xl flex justify-between items-center font-bold">
                <div class="flex items-center space-x-2">
                    <span class="bg-blue-800 text-white text-xs px-2 py-0.5 rounded-full" x-text="cartCount"></span>
                    <span class="text-sm">장바구니 보기</span>
                </div>
                <span class="text-base" x-text="cartTotal.toLocaleString() + '원'"></span>
            </button>
        </div>
        <!-- 옵션 선택 및 주문 모달이 바인딩될 컨테이너 -->
        <div id="modal-container"></div>

    </div>
<script>
function cartData() {
    return {
        qrToken: '{{ qr_token }}',
        cartCount: 0,
        cartTotal: 0,
        showModal: false,
        showCartModal: false,
        isSubmitting: false,
        currentCategory: '0', //전체 카테고리
        cartItems: [],
        specialInstruction: '',
        
        addToCart(item) {
            console.log('Adding to cart:', item);
            const existingItem = this.cartItems.find(cartItem => cartItem.itemId === item.itemId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                this.cartItems.push({ ...item, quantity: 1 });
            }
            this.updateCartTotals();
        },
        removeFromCart(itemId) {
            this.cartItems = this.cartItems.filter(item => item.itemId !== itemId);
            this.updateCartTotals();
        },
        updateCartTotals() {
            console.log('Updating cart totals. Current items:', this.cartItems);
            this.cartCount = this.cartItems.reduce((sum, item) => sum + item.quantity, 0);
            this.cartTotal = this.cartItems.reduce((sum, item) => sum + (item.subtotalPrice * item.quantity), 0);
        },
        setCategory(category) {
            this.currentCategory = category;
            // Trigger a custom event to notify other components of the category change
            htmx.trigger(document.body, 'category-changed', { category: category });
        },
        submitOrder() {
            if (this.isSubmitting) return;
            this.isSubmitting = true;

            const orderData = {
                qr_token: this.qrToken,
                cart_items: this.cartItems.map(item => ({
                    item_id: item.itemId,
                    item_name: item.itemName,
                    base_price: item.basePrice,
                    quantity: item.quantity,
                    options: item.options,
                    subtotal_price: item.subtotalPrice
                })),
                special_instruction: this.specialInstruction
            };
            console.log('Submitting order:', orderData);
            fetch('/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            })//json 리턴이 아니기때문에 html 받아서 팝업창 처리 ?
            .then(res => res.text())
            .then(data => {
                console.log('Order submitted successfully');
                // Reset cart and close modal
                this.cartItems = [];
                this.updateCartTotals();
                this.showCartModal = false;
                this.specialInstruction = '';
                // 서버에서 받은 HTML을 모달 컨테이너에 삽입
                document.getElementById('modal-container').innerHTML = data;
            })
            .catch(error => {
                console.error('Error submitting order:', error);
            })
            .finally(() => {
                this.isSubmitting = false;
            });
        }
    }
}
function optionData(data) {
    console.log('optionData initialized with item:', data);
    return {
        optionGroups: data.option_groups,
        basePrice: data.basePrice,
        quantity: 1,
        selectedOptions: [],
        showAlert: false,
        selectedRequiredGroupName: "",
        calcItemTotal() {
            let optionsSum = this.selectedOptions.reduce((acc, opt) => acc + opt.price, 0);
            return (this.basePrice + optionsSum) * this.quantity;
        },
        addToCartAndClose() {
            // 필수 옵션 검증 체크
            console.log('addToCartAnd Close',this.selectedOptions);
            for (let group of this.optionGroups) {
                if (group.isRequired) {
                    const hasSelected = this.selectedOptions.some(opt => opt.groupId === group.groupId);
                    if (!hasSelected) {
                        // alert(`필수 옵션 "${group.groupName}"을 선택해주세요.`);
                        this.showAlert = true;
                        this.selectedRequiredGroupName = group.groupName;
                        return;
                    }
                }
            }
            // 부모 Alpine 장바구니에 항목 추가
            this.$dispatch('add-to-cart', {
                itemId: data.itemId,
                itemName: data.itemName,
                basePrice: this.basePrice,
                quantity: this.quantity,
                subtotalPrice: this.calcItemTotal(),
                options: this.selectedOptions.map(o => ({ name: o.name, additional_price: o.price }))
            });
            // 모달 DOM 닫기
            document.getElementById('modal-container').innerHTML = '';
        }
    }
}
</script>
</body>
</html>
