<!-- app/templates/client/fragments/order_completed.html -->
<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center my-6 space-y-5 animate-fade-in">
    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
        ✓
    </div>

    <div>
        <h2 class="text-lg font-bold text-gray-900">주문이 성공적으로 접수되었습니다</h2>
        <p class="text-xs text-gray-500 mt-1">테이블 {{ table_number }}번 / 주문번호 #{{ order.id }}</p>
    </div>

    <!-- 진행 상황 표시 바 -->
    <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
        <div class="flex justify-between items-center text-xs font-bold text-gray-500 mb-2">
            <span class="text-blue-600">1. 주문 접수</span>
            <span>2. 조리 중</span>
            <span>3. 조리 완료</span>
        </div>
        <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
            <div class="bg-blue-600 h-full w-1/3 transition-all duration-500"></div>
        </div>
        <p class="text-[11px] text-gray-400 mt-2">매장 관리자가 확인 후 즉시 조리를 시작합니다.</p>
    </div>

    <div class="border-t pt-4 text-left">
        <div class="flex justify-between text-sm font-bold text-gray-800">
            <span>주문 금액 합계</span>
            <span class="text-blue-600">{{ "{:,}".format(order.total_price) }}원</span>
        </div>
        {% if order.special_instruction %}
        <p class="text-xs text-gray-500 mt-2 bg-gray-50 p-2 rounded">
            요청사항: {{ order.special_instruction }}
        </p>
        {% endif %}
    </div>

    <button type="button" 
            onclick="location.reload()" 
            class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition">
        메뉴판으로 돌아가기 (추가 주문)
    </button>
</div>
