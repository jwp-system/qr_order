<!-- app/templates/client/fragments/order_completed.html -->
<div 
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4">
    
    <!-- 모달 본체 -->
    <div 
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        class="bg-white rounded-2xl p-6 shadow-2xl border border-gray-100 text-center space-y-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
        
        <!-- 완료 아이콘 -->
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-3xl font-extrabold shadow-sm">
            ✓
        </div>

        <!-- 타이틀 및 메타 정보 -->
        <div class="space-y-2">
            <h2 class="text-xl font-bold text-gray-900">주문이 접수되었습니다</h2>
            <div class="inline-flex items-center gap-2 bg-gray-100 px-3 py-1 rounded-full text-xs font-semibold text-gray-600">
                <span>테이블 <strong class="text-gray-900">{{ table_number }}</strong>번</span>
                <span class="text-gray-300">|</span>
                <span>주문번호 <strong class="text-blue-600">#{{ order.id }}</strong></span>
            </div>
        </div>

        <!-- 주문 진행 단계 (스텝 인디케이터) -->
        <div class="bg-gray-50 rounded-2xl p-5 border border-gray-100 text-left">
            <div class="grid grid-cols-3 gap-2 text-center relative mb-4">
                <!-- 1단계: 접수 완료 (활성) -->
                <div class="flex flex-col items-center">
                    <span class="w-7 h-7 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center mb-1 shadow-sm">1</span>
                    <span class="text-xs font-bold text-blue-600">주문 접수</span>
                </div>
                <!-- 2단계: 조리 중 (대기) -->
                <div class="flex flex-col items-center">
                    <span class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 text-xs font-bold flex items-center justify-center mb-1">2</span>
                    <span class="text-xs font-medium text-gray-400">조리 중</span>
                </div>
                <!-- 3단계: 조리 완료 (대기) -->
                <div class="flex flex-col items-center">
                    <span class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 text-xs font-bold flex items-center justify-center mb-1">3</span>
                    <span class="text-xs font-medium text-gray-400">조리 완료</span>
                </div>
            </div>

            <!-- 프로그레스 게이지 바 -->
            <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full w-1/3 rounded-full transition-all duration-500"></div>
            </div>

            <p class="text-center text-[11px] text-gray-400 mt-3">매장에서 주문 확인 후 조리를 시작합니다.</p>
        </div>

        <!-- 결제 및 요청사항 요약 카드 -->
        <div class="bg-white border border-gray-100 rounded-xl p-4 space-y-3 text-left shadow-xs">
            <div class="flex justify-between items-center text-sm font-bold text-gray-800">
                <span>주문 금액 합계</span>
                <span class="text-lg font-black text-blue-600">{{ "{:,}".format(order.total_price) }}원</span>
            </div>

            {% if order.special_instruction %}
            <div class="pt-2 border-t border-gray-100">
                <span class="text-[11px] font-bold text-gray-400 block mb-1">매장/주방 요청 사항</span>
                <p class="text-xs text-gray-700 bg-gray-50 p-2.5 rounded-lg border border-gray-200/60 leading-relaxed">
                    {{ order.special_instruction }}
                </p>
            </div>
            {% endif %}
        </div>

        <!-- 하단 액션 버튼 -->
        <button type="button" 
                onclick="location.reload()" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl text-sm transition shadow-md shadow-blue-500/20">
            메뉴판으로 돌아가기 (추가 주문)
        </button>
    </div>
</div>
