<!-- app/templates/client/fragments/option_modal.html -->
<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm"
     x-data="{
        basePrice: {{ item.price }},
        quantity: 1,
        selectedOptions: [],
        
        calcItemTotal() {
            let optionsSum = this.selectedOptions.reduce((acc, opt) => acc + opt.price, 0);
            return (this.basePrice + optionsSum) * this.quantity;
        },
        addToCartAndClose() {
            // 필수 옵션 검증 체크
            {% for group in item.option_groups if group.is_required %}
            if (!this.selectedOptions.some(opt => opt.groupId === {{ group.id }})) {
                alert('\'{{ group.name }}\' 옵션을 반드시 선택해 주세요.');
                return;
            }
            {% endfor %}

            // 부모 Alpine 장바구니에 항목 추가
            $dispatch('add-to-cart', {
                itemId: {{ item.id }},
                itemName: '{{ item.name }}',
                basePrice: this.basePrice,
                quantity: this.quantity,
                subtotalPrice: this.calcItemTotal(),
                options: this.selectedOptions.map(o => ({ name: o.name, additional_price: o.price }))
            });

            // 모달 DOM 닫기
            document.getElementById('modal-container').innerHTML = '';
        }
     }">

    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col overflow-hidden animate-slide-up shadow-2xl">
        <!-- 모달 헤더 -->
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <div>
                <h3 class="text-lg font-bold text-gray-900">{{ item.name }}</h3>
                <p class="text-sm font-semibold text-blue-600">{{ "{:,}".format(item.price) }}원</p>
            </div>
            <button type="button" 
                    onclick="document.getElementById('modal-container').innerHTML = ''"
                    class="text-gray-400 hover:text-gray-600 p-1 rounded-full text-2xl font-bold leading-none">
                &times;
            </button>
        </div>

        <!-- 옵션 본문 (스크롤 영역) -->
        <div class="p-5 overflow-y-auto space-y-6">
            {% if item.description %}
            <p class="text-xs text-gray-500 bg-gray-100 p-2.5 rounded-lg">{{ item.description }}</p>
            {% endif %}

            {% for group in item.option_groups %}
            <div class="space-y-2 border-b pb-4">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-sm text-gray-800">{{ group.name }}</span>
                    {% if group.is_required %}
                    <span class="text-[11px] font-semibold text-red-500 bg-red-50 px-2 py-0.5 rounded">필수</span>
                    {% else %}
                    <span class="text-[11px] text-gray-400">선택</span>
                    {% endif %}
                </div>

                <div class="space-y-2 pt-1">
                    {% for detail in group.details %}
                    <label class="flex items-center justify-between p-2.5 rounded-lg border border-gray-200 hover:bg-blue-50/40 cursor-pointer transition">
                        <div class="flex items-center space-x-2.5">
                            {% if group.option_type.value == 'SELECT' %}
                            <input type="radio" 
                                   name="group_{{ group.id }}" 
                                   value="{{ detail.id }}"
                                   @change="
                                        selectedOptions = selectedOptions.filter(o => o.groupId !== {{ group.id }});
                                        selectedOptions.push({ groupId: {{ group.id }}, name: '{{ detail.name }}', price: {{ detail.additional_price }} });
                                   "
                                   class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            {% else %}
                            <input type="checkbox" 
                                   value="{{ detail.id }}"
                                   @change="
                                        if ($el.checked) {
                                            selectedOptions.push({ groupId: {{ group.id }}, name: '{{ detail.name }}', price: {{ detail.additional_price }} });
                                        } else {
                                            selectedOptions = selectedOptions.filter(o => !(o.groupId === {{ group.id }} && o.name === '{{ detail.name }}'));
                                        }
                                   "
                                   class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                            {% endif %}
                            <span class="text-sm text-gray-700">{{ detail.name }}</span>
                        </div>
                        <span class="text-xs font-medium text-gray-600">
                            {% if detail.additional_price > 0 %}+{{ "{:,}".format(detail.additional_price) }}원{% else %}0원{% endif %}
                        </span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}

            <!-- 수량 선택기 -->
            <div class="flex items-center justify-between pt-2">
                <span class="font-bold text-sm text-gray-800">수량</span>
                <div class="flex items-center space-x-3 border border-gray-300 rounded-lg p-1 bg-gray-50">
                    <button type="button" @click="if(quantity > 1) quantity--" class="w-8 h-8 rounded bg-white shadow-sm flex items-center justify-center font-bold text-gray-600 active:scale-95">-</button>
                    <span class="font-bold text-sm w-6 text-center" x-text="quantity"></span>
                    <button type="button" @click="quantity++" class="w-8 h-8 rounded bg-white shadow-sm flex items-center justify-center font-bold text-gray-600 active:scale-95">+</button>
                </div>
            </div>
        </div>

        <!-- 모달 푸터 버튼 -->
        <div class="p-4 border-t bg-gray-50">
            <button type="button"
                    @click="addToCartAndClose()"
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-between px-5">
                <span class="text-sm">장바구니 담기</span>
                <span class="text-base font-extrabold" x-text="calcItemTotal().toLocaleString() + '원'"></span>
            </button>
        </div>
    </div>
</div>
