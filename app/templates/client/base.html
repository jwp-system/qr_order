<!-- client/base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}주문하기{% endblock %} | QuickOrder</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {# cart.js는 Alpine보다 먼저 로드되어야 x-data="cartData()"가 동작합니다 #}
    <script src="{{ url_for('static', path='js/client/cart.js') }}"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        [x-cloak] { display: none !important; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-[#F9FAFB] text-[#191F28] antialiased selection:bg-blue-100"
      x-data='cartData({{ qr_token|tojson }})'
      @add-to-cart.window="addToCart($event.detail)">

    <div class="max-w-[480px] mx-auto min-h-screen bg-white flex flex-col pb-28 shadow-sm">
        {% block body %}{% endblock %}

        {# 옵션 선택, 장바구니, 주문완료, 주문현황 모달이 들어갈 자리 #}
        <div id="modal-container"></div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
