<!-- app/templates/super_admin/fragments/store_row.html -->
<tr id="store-row-{{ store.id }}" class="border-b border-gray-100 hover:bg-gray-50/60 transition">
    <td class="px-5 py-4">
        <div class="font-bold text-sm text-gray-900">{{ store.name }}</div>
        <div class="text-[11px] text-gray-400 font-mono">ID: #{{ store.id }}</div>
    </td>
    <td class="px-5 py-4">
        <span class="inline-block font-mono text-xs font-extrabold text-blue-700 bg-blue-50 border border-blue-200 px-2 py-1 rounded">
            {{ store.service_code }}
        </span>
    </td>
    <td class="px-5 py-4 text-xs font-semibold text-gray-600">
        {{ store.tables | length }}개 테이블
    </td>
    <td class="px-5 py-4">
        <!-- 라이선스 상태 선택 폼 (변경 즉시 HTMX 요청 전송) -->
        <form hx-post="/super/stores/{{ store.id }}/license"
              hx-target="#store-row-{{ store.id }}"
              hx-swap="outerHTML">
            <select name="status" 
                    onchange="this.form.requestSubmit()"
                    class="text-xs font-bold rounded-lg border px-2.5 py-1.5 focus:ring-blue-500
                           {% if store.license_status.value == 'ACTIVE' %}border-emerald-300 bg-emerald-50 text-emerald-800
                           {% elif store.license_status.value == 'TRIAL' %}border-amber-300 bg-amber-50 text-amber-800
                           {% else %}border-red-300 bg-red-50 text-red-800{% endif %}">
                {% for st in license_statuses %}
                <option value="{{ st.value }}" {% if store.license_status.value == st.value %}selected{% endif %}>
                    {{ st.value }}
                </option>
                {% endfor %}
            </select>
        </form>
    </td>
    <td class="px-5 py-4 text-xs text-gray-400">
        {{ store.created_at.strftime('%Y-%m-%d') if store.created_at else '-' }}
    </td>
    <td class="px-5 py-4 text-right">
        <button type="button"
                hx-post="/super/stores/{{ store.id }}/reset-pins"
                hx-target="#store-row-{{ store.id }}"
                hx-swap="outerHTML"
                hx-confirm="관리자(1234), 주방(0000), 홀(1111) 핀코드를 초기화하시겠습니까?"
                class="text-xs font-semibold text-gray-500 hover:text-red-600 border border-gray-200 hover:border-red-200 px-2.5 py-1 rounded-md transition">
            PIN 초기화
        </button>
    </td>
</tr>
