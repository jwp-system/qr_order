{# common/order_grid.html — 보드 카드 그리드 (관리자 / 주방 / 홀 공통, HTMX 폴링 대상)
   context: orders, board (core/board_config.BOARDS 항목) #}
{% set role = board.role %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for order in orders %}
        {% include board.card_template %}
    {% else %}
        <div class="col-span-full py-24 text-center bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 {{ board.theme.empty_icon_wrap }}">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <p class="text-base font-bold text-gray-500">{{ board.empty_title }}</p>
            <p class="text-xs text-gray-400 mt-1">{{ board.empty_desc }}</p>
        </div>
    {% endfor %}
</div>
