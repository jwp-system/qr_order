<!-- client/partials/menu_item.html  (context: cat, item) -->
{% set sold_out = item.is_sold_out %}

<article
    class="flex items-center justify-between p-4 rounded-2xl
           {% if sold_out %}
             bg-[#FAFAFA] border border-[#EEEEEE] opacity-60 cursor-not-allowed
           {% else %}
             bg-white border border-[#F2F4F6] shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-[0.98] transition cursor-pointer
           {% endif %}"
    x-show="currentCategory === '0' || currentCategory === '{{ cat.id }}'"
    {% if not sold_out %}
    hx-get="/items/{{ item.id }}/modal"
    hx-target="#modal-container"
    @click="showModal = true"
    {% endif %}>

    <div class="flex-1 pr-3">
        <div class="flex items-center gap-1.5 mb-1">
            {% if item.display_order == 0 %}
                <span class="text-[11px] font-bold text-[#E84057] bg-rose-50 px-1.5 py-0.5 rounded-md">인기</span>
            {% endif %}
            {% if sold_out %}
                <span class="text-[11px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded-md">품절</span>
            {% endif %}
            <h2 class="text-base font-bold text-[#191F28]">{{ item.name }}</h2>
        </div>
        <p class="text-xs text-[#8B95A1] line-clamp-2 leading-relaxed">{{ item.description }}</p>
        <span class="text-base font-bold text-[#191F28] mt-2 block">{{ "{:,}".format(item.price) }}원</span>
    </div>

    <div class="w-20 h-20 bg-gray-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center text-gray-300 font-bold text-xs">
        {% if item.image_url %}
            <img src="{{ item.image_url }}" alt="{{ item.name }}" class="w-full h-full object-cover">
        {% else %}
            IMAGE
        {% endif %}
    </div>
</article>
