<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주문하기 | QuickOrder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F9FAFB] text-[#191F28] antialiased selection:bg-blue-100" 
      x-data="{ cartCount: 2, cartTotal: 24000, showModal: false }">

    <!-- 모바일 컨테이너 (최대 480px 중앙 정렬) -->
    <div class="max-w-[480px] mx-auto min-h-screen bg-white flex flex-col pb-28 shadow-sm">
        
        <!-- 상단 헤더: 매장 및 테이블 인디케이터 -->
        <header class="sticky top-0 bg-white/90 backdrop-blur-md z-20 px-5 pt-4 pb-3 border-b border-[#F2F4F6]">
            <div class="flex items-center justify-between">
                <div>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-[#3182F6]">
                        테이블 05번
                    </span>
                    <h1 class="text-xl font-bold tracking-tight text-[#191F28] mt-1">을지로 카츠 본점</h1>
                </div>
                <div class="text-right">
                    <span class="text-xs text-[#8B95A1] block font-medium">직원 호출</span>
                </div>
            </div>

            <!-- 카테고리 가로 스크롤 칩 (Toss Style) -->
            <nav class="flex gap-2 mt-4 overflow-x-auto no-scrollbar py-1">
                <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-[#191F28] text-white shrink-0 shadow-sm transition">전체</button>
                <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-[#F2F4F6] text-[#4E5968] shrink-0 hover:bg-[#E5E8EB] transition">메인 카츠</button>
                <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-[#F2F4F6] text-[#4E5968] shrink-0 hover:bg-[#E5E8EB] transition">사이드/추가</button>
                <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-[#F2F4F6] text-[#4E5968] shrink-0 hover:bg-[#E5E8EB] transition">음료/주류</button>
            </nav>
        </header>

        <!-- 메뉴 목록 -->
        <main class="flex-1 px-5 pt-4 space-y-4">
            
            <!-- 메뉴 아이템 1 (인기 메뉴) -->
            <article class="flex items-center justify-between p-4 rounded-2xl bg-white border border-[#F2F4F6] shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-[0.98] transition cursor-pointer"
                     hx-get="/items/1/modal" 
                     hx-target="#modal-container" 
                     @click="showModal = true">
                <div class="flex-1 pr-3">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="text-[11px] font-bold text-[#E84057] bg-rose-50 px-1.5 py-0.5 rounded-md">인기</span>
                        <h2 class="text-base font-bold text-[#191F28]">특등심 카츠 정식</h2>
                    </div>
                    <p class="text-xs text-[#8B95A1] line-clamp-2 leading-relaxed">숙성된 특수 부위 등심의 풍부한 육즙과 부드러운 식감</p>
                    <span class="text-base font-bold text-[#191F28] mt-2 block">14,000원</span>
                </div>
                <div class="w-20 h-20 bg-gray-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center text-gray-300 font-bold text-xs">
                    IMAGE
                </div>
            </article>

            <!-- 메뉴 아이템 2 -->
            <article class="flex items-center justify-between p-4 rounded-2xl bg-white border border-[#F2F4F6] shadow-[0_2px_8px_rgba(0,0,0,0.04)] active:scale-[0.98] transition cursor-pointer"
                     hx-get="/items/2/modal" 
                     hx-target="#modal-container" 
                     @click="showModal = true">
                <div class="flex-1 pr-3">
                    <h2 class="text-base font-bold text-[#191F28]">안심 히레카츠 정식</h2>
                    <p class="text-xs text-[#8B95A1] line-clamp-2 leading-relaxed mt-1">부드러움의 극치, 촉촉한 육즙의 핑키쉬 히레카츠</p>
                    <span class="text-base font-bold text-[#191F28] mt-2 block">13,000원</span>
                </div>
                <div class="w-20 h-20 bg-gray-100 rounded-xl overflow-hidden shrink-0 flex items-center justify-center text-gray-300 font-bold text-xs">
                    IMAGE
                </div>
            </article>

            <!-- 메뉴 아이템 3 (품절 상태) -->
            <article class="flex items-center justify-between p-4 rounded-2xl bg-[#FAFAFA] border border-[#EEEEEE] opacity-60 cursor-not-allowed">
                <div class="flex-1 pr-3">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="text-[11px] font-bold text-[#8B95A1] bg-gray-200 px-1.5 py-0.5 rounded-md">품절</span>
                        <h2 class="text-base font-bold text-[#6B7684]">치즈 카츠 (일일 30인분 한정)</h2>
                    </div>
                    <p class="text-xs text-[#8B95A1] line-clamp-2 leading-relaxed">자연산 모짜렐라 치즈가 듬뿍 들어간 한정 메뉴</p>
                    <span class="text-base font-bold text-[#8B95A1] mt-2 block">13,500원</span>
                </div>
                <div class="w-20 h-20 bg-gray-200 rounded-xl shrink-0 flex items-center justify-center text-xs font-semibold text-[#8B95A1]">
                    품절
                </div>
            </article>
        </main>

        <!-- 토스 스타일 하단 플로팅 장바구니 바 -->
        <div class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto p-4 bg-gradient-to-t from-white via-white to-white/0 z-30 pointer-events-none">
            <button class="pointer-events-auto w-full h-14 bg-[#3182F6] hover:bg-[#2272EB] text-white rounded-2xl px-5 flex items-center justify-between font-bold text-base shadow-lg shadow-blue-500/25 active:scale-[0.98] transition"
                    hx-get="/static/order/option_modal.html"
                    hx-target="#modal-container"
                    @click="showModal = true">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-xs font-black" x-text="cartCount"></span>
                    <span>장바구니 확인</span>
                </div>
                <div>
                    <span x-text="cartTotal.toLocaleString() + '원'"></span>
                </div>
            </button>
        </div>

        <!-- 옵션 선택 및 주문 모달이 바인딩될 컨테이너 -->
        <div id="modal-container"></div>
    </div>
</body>
</html>
