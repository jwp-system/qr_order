<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주방 디스플레이 (KDS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: "Pretendard", sans-serif; }
    </style>
</head>
<body class="bg-[#F2F4F6] text-[#191F28] p-6 antialiased">

    <!-- 상단 상태 바 -->
    <header class="flex items-center justify-between mb-6 bg-white p-4 px-6 rounded-2xl shadow-sm border border-[#E5E8EB]">
        <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-tight">주방 주문 현황</h1>
            <span class="text-sm font-semibold text-[#8B95A1]">을지로 카츠 본점</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-sm font-semibold text-[#4E5968]">
                조리 대기 <span class="text-[#E84057] font-bold text-base">2</span>건 | 조리 중 <span class="text-[#3182F6] font-bold text-base">1</span>건
            </div>
            <button class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-[#F2F4F6] text-[#6B7684]">소리 켬 🔔</button>
        </div>
    </header>

    <!-- KDS 카드 그리드 (SSE 스트림 구독) -->
    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"
          hx-ext="sse" 
          sse-connect="/stores/1/events" 
          sse-swap="order-created" 
          hx-target="this" 
          hx-swap="afterbegin">
        
        <!-- 주문 카드 1 (조리 대기 - 시간 경과 경고) -->
        <article id="kds-card-101" class="bg-white rounded-2xl border-2 border-[#E84057] shadow-sm flex flex-col overflow-hidden">
            <div class="bg-rose-50 px-4 py-3 flex items-center justify-between border-b border-rose-100">
                <span class="text-lg font-black text-[#E84057]">테이블 05</span>
                <span class="text-xs font-bold text-[#E84057] px-2 py-1 rounded bg-white">12분 경과</span>
            </div>
            
            <div class="p-4 flex-1 space-y-3">
                <div class="border-b border-[#F2F4F6] pb-3">
                    <div class="flex justify-between items-baseline">
                        <span class="font-bold text-base text-[#191F28]">특등심 카츠 정식</span>
                        <span class="font-black text-lg text-[#3182F6]">1</span>
                    </div>
                    <ul class="text-xs text-[#8B95A1] mt-1 space-y-0.5">
                        <li>• 매콤 소스</li>
                        <li>• 공기밥 추가</li>
                    </ul>
                </div>

                <div class="border-b border-[#F2F4F6] pb-3">
                    <div class="flex justify-between items-baseline">
                        <span class="font-bold text-base text-[#191F28]">콜라 (355ml)</span>
                        <span class="font-black text-lg text-[#3182F6]">2</span>
                    </div>
                </div>

                <!-- 고객 요청사항 강조 배지 -->
                <div class="bg-amber-50 rounded-xl p-2.5 border border-amber-200">
                    <span class="text-[11px] font-bold text-amber-800 block mb-0.5">요청사항</span>
                    <p class="text-xs font-bold text-amber-900">"양배추 샐러드 드레싱 많이 부탁드립니다."</p>
                </div>
            </div>

            <!-- 조리 버튼 -->
            <div class="p-3 bg-[#F9FAFB] border-t border-[#F2F4F6]">
                <button class="w-full h-12 rounded-xl bg-[#3182F6] hover:bg-[#2272EB] text-white font-bold text-sm shadow-sm transition active:scale-[0.98]"
                        hx-post="/orders/101/cook-start"
                        hx-target="#kds-card-101"
                        hx-swap="outerHTML">
                    조리 시작
                </button>
            </div>
        </article>

        <!-- 주문 카드 2 (조리 중) -->
        <article id="kds-card-102" class="bg-white rounded-2xl border border-[#E5E8EB] shadow-sm flex flex-col overflow-hidden">
            <div class="bg-blue-50 px-4 py-3 flex items-center justify-between border-b border-blue-100">
                <span class="text-lg font-black text-[#3182F6]">테이블 02</span>
                <span class="text-xs font-bold text-[#3182F6] px-2 py-1 rounded bg-white">4분 경과</span>
            </div>
            
            <div class="p-4 flex-1 space-y-3">
                <div class="border-b border-[#F2F4F6] pb-3">
                    <div class="flex justify-between items-baseline">
                        <span class="font-bold text-base text-[#191F28]">안심 히레카츠 정식</span>
                        <span class="font-black text-lg text-[#3182F6]">2</span>
                    </div>
                    <ul class="text-xs text-[#8B95A1] mt-1 space-y-0.5">
                        <li>• 기본 소스</li>
                    </ul>
                </div>
            </div>

            <!-- 완료 버튼 -->
            <div class="p-3 bg-[#F9FAFB] border-t border-[#F2F4F6]">
                <button class="w-full h-12 rounded-xl bg-[#191F28] hover:bg-[#333D4B] text-white font-bold text-sm shadow-sm transition active:scale-[0.98]"
                        hx-post="/orders/102/cook-done"
                        hx-target="#kds-card-102"
                        hx-swap="delete">
                    조리 완료
                </button>
            </div>
        </article>
    </main>
</body>
</html>
