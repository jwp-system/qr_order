<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine.js Todo List</title>
  <!-- Alpine.js 최신 CDN 로드 -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; color: #333; }
    h1 { text-align: center; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    button { padding: 10px 16px; border: none; background: #2563eb; color: #fff; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px; border-bottom: 1px solid #eee; }
    .todo-content { display: flex; align-items: center; gap: 10px; flex: 1; }
    .completed { text-decoration: line-through; color: #888; }
    .btn-delete { background: #ef4444; padding: 6px 10px; font-size: 13px; }
    .btn-delete:hover { background: #dc2626; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 14px; color: #666; }
    .filters button { background: none; color: #666; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px; }
    .filters button.active { border-color: #2563eb; color: #2563eb; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Todo List</h1>

  <!-- Alpine 컴포넌트 루트 -->
  <div x-data="todoApp()">
    
    <!-- 1. 할 일 추가 폼 -->
    <form @submit.prevent="addTodo()">
      <input type="text" x-model="newTodoText" placeholder="할 일을 입력하세요..." required>
      <input type="text" x-model="newTodoDesc" placeholder="할 일 설명을 입력하세요..." />
      <button type="submit">추가</button>
    </form>

    <!-- 2. 할 일 목록 -->
    <ul>
      <template x-for="todo in filteredTodos" :key="todo.id">
        <li>
          <div class="todo-content">
            <input type="checkbox" x-model="todo.completed" @change="save()">
            <h3 :class="{ 'completed': todo.completed }" x-text="todo.text"></h3>
            <span :class="{ 'completed': todo.completed }" x-text="todo.desc"></span>
          </div>
          <button class="btn-delete" @click="deleteTodo(todo.id)">삭제</button>
        </li>
      </template>
      <li x-show="filteredTodos.length === 0" style="text-align: center; color: #999; justify-content: center;">
        표시할 항목이 없습니다.
      </li>
    </ul>

    <!-- 3. 필터 및 하단 정보 바 -->
    <div class="toolbar" x-show="todos.length > 0">
      <span>남은 항목: <strong x-text="remainingCount"></strong></span>

      <div class="filters">
        <button type="button" :class="{ 'active': filter === 'all' }" @click="setFilter('all')">전체</button>
        <button type="button" :class="{ 'active': filter === 'active' }" @click="setFilter('active')">진행 중</button>
        <button type="button" :class="{ 'active': filter === 'completed' }" @click="setFilter('completed')">완료</button>
      </div>

      <button type="button" style="background: none; color: #888; font-size: 13px; padding: 0;" @click="clearCompleted()" x-show="todos.some(t => t.completed)">
        완료 항목 삭제
      </button>
    </div>

  </div>

  <script>
    function todoApp() {
      return {
        // localStorage 동기화
        todos: [],
        newTodoText: '',
        newTodoDesc: '',
        filter: 'all',

        setFilter(filter){
          this.filter = filter;
          console.log('Filter changed to:', filter);
        },

        addTodo() {
          const text = this.newTodoText.trim();
          const desc = this.newTodoDesc.trim();
          if (!text) return;

          this.todos.push({
            id: Date.now(),
            text: text,
            desc: desc,
            completed: false
          });

          this.newTodoText = '';
          this.newTodoDesc = '';
        },

        deleteTodo(id) {
          this.todos = this.todos.filter(t => t.id !== id);
        },

        clearCompleted() {
          this.todos = this.todos.filter(t => !t.completed);
        },

        // 계산된 속성 (Getter)
        get remainingCount() {
          return this.todos.filter(t => !t.completed).length;
        },

        get filteredTodos() {
          if (this.filter === 'active') return this.todos.filter(t => !t.completed);
          if (this.filter === 'completed') return this.todos.filter(t => t.completed);
          return this.todos;
        }
      };
    }
  </script>
</body>
</html>
