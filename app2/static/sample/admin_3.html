<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Order Admin - 상태 필터링</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            hoverBlue: '#1B64DA',
                            lightBlue: '#E8F3FF',
                            dark: '#191F28',
                            gray: '#8B95A1',
                            lightGray: '#F2F4F6',
                            border: '#E5E8EB',
                            bg: '#F9FAFB',
                            red: '#F04452',
                            lightRed: '#FEECEE',
                            orange: '#FF8800',
                            lightOrange: '#FFF3E5',
                            green: '#04B066',
                            lightGreen: '#E6F8F0'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-toss-bg text-toss-dark font-sans antialiased min-h-screen">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-toss-border/60 shrink-0 select-none">
        <div class="px-6 py-7">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-toss-blue flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-toss-blue/30">
                    Q
                </div>
                <h1 class="text-xl font-bold tracking-tight text-toss-dark">
                    QR Order
                </h1>
            </div>
            <div class="mt-4 flex items-center justify-between p-3 bg-toss-bg rounded-xl">
                <div>
                    <p class="text-xs text-toss-gray font-medium">현재 매장</p>
                    <p class="text-sm font-semibold text-toss-dark">맛있는 식당 강남점</p>
                </div>
                <span class="inline-flex w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-50"></span>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-toss-lightBlue text-toss-blue font-semibold transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                주문 관리
                <span id="nav-new-badge" class="ml-auto bg-toss-blue text-white text-xs font-bold px-2 py-0.5 rounded-full">2</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-toss-gray hover:text-toss-dark hover:bg-toss-lightGray/60 font-medium transition-all">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                통계 분석
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">

        <!-- Top Header -->
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 px-8 py-5 border-b border-toss-border/60 flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-toss-dark">
                    주문 현황
                </h2>
                <p id="header-status-text" class="text-sm text-toss-gray mt-0.5 font-medium">
                    새로운 주문을 확인해주세요.
                </p>
            </div>
            <div class="flex items-center gap-2 text-sm font-medium text-toss-gray">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                실시간 연동 중
            </div>
        </header>

        <!-- Body Container -->
        <div class="p-8 max-w-7xl mx-auto w-full space-y-6">

            <!-- KPI Cards -->
            <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-toss-blue transition" onclick="switchTab('ALL')">
                    <span class="text-xs font-semibold text-toss-gray">오늘 전체 주문</span>
                    <div class="text-2xl font-black text-toss-dark mt-2 tracking-tight" id="kpi-total">4건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border-2 border-toss-blue/30 shadow-sm cursor-pointer hover:border-toss-blue transition" onclick="switchTab('NEW')">
                    <span class="text-xs font-semibold text-toss-blue">신규 주문</span>
                    <div class="text-2xl font-black text-toss-blue mt-2 tracking-tight" id="kpi-new">2건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-amber-400 transition" onclick="switchTab('COOKING')">
                    <span class="text-xs font-semibold text-toss-orange">조리 중</span>
                    <div class="text-2xl font-black text-toss-orange mt-2 tracking-tight" id="kpi-cooking">1건</div>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-toss-border/60 shadow-sm cursor-pointer hover:border-emerald-400 transition" onclick="switchTab('DONE')">
                    <span class="text-xs font-semibold text-toss-green">완료</span>
                    <div class="text-2xl font-black text-toss-green mt-2 tracking-tight" id="kpi-done">1건</div>
                </div>
            </section>

            <!-- Toss-style Segmented Filter Tab -->
            <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                <div class="inline-flex p-1 bg-slate-200/60 rounded-2xl max-w-md w-full sm:w-auto shadow-inner">
                    <button onclick="switchTab('ALL')" id="tab-ALL" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-toss-dark shadow-sm">
                        전체 <span id="badge-all" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightGray text-toss-gray font-bold">4</span>
                    </button>
                    <button onclick="switchTab('NEW')" id="tab-NEW" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark">
                        신규 <span id="badge-new" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightBlue text-toss-blue font-bold">2</span>
                    </button>
                    <button onclick="switchTab('COOKING')" id="tab-COOKING" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark">
                        조리중 <span id="badge-cooking" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightOrange text-toss-orange font-bold">1</span>
                    </button>
                    <button onclick="switchTab('DONE')" id="tab-DONE" class="tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark">
                        완료 <span id="badge-done" class="text-xs px-2 py-0.5 rounded-full bg-toss-lightGreen text-toss-green font-bold">1</span>
                    </button>
                </div>
            </section>

            <!-- Order Cards Container -->
            <section class="space-y-4">
                <div id="order-container" class="space-y-4">
                    <!-- Javascript가 주문 카드를 렌더링합니다 -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-20 bg-white rounded-3xl border border-dashed border-toss-border">
                    <p class="text-4xl mb-3">🍃</p>
                    <h4 class="text-lg font-bold text-toss-dark">해당 상태의 주문이 없습니다</h4>
                    <p class="text-sm text-toss-gray mt-1">새로운 주문이 들어오면 실시간으로 업데이트됩니다.</p>
                </div>
            </section>

        </div>
    </main>
</div>

<!-- 필터 및 인터랙션 자바스크립트 -->
<script>
    // 샘플 주문 데이터셋
    let orders = [
        {
            id: 104,
            table: '5번 테이블',
            time: '방금 전',
            status: 'NEW', // NEW | COOKING | DONE
            payType: 'QR 토스페이',
            totalPrice: '27,000원',
            items: [
                { name: '비빔냉면', qty: 2 },
                { name: '돈까스 (매운맛)', qty: 1 }
            ]
        },
        {
            id: 105,
            table: '2번 테이블',
            time: '2분 전',
            status: 'NEW',
            payType: '카드 결제',
            totalPrice: '9,000원',
            items: [
                { name: '물냉면', qty: 1 }
            ]
        },
        {
            id: 102,
            table: '8번 테이블',
            time: '12분 전',
            status: 'COOKING',
            payType: '카카오페이',
            totalPrice: '34,000원',
            items: [
                { name: '치즈 돈까스', qty: 2 },
                { name: '콜라 355ml', qty: 2 }
            ]
        },
        {
            id: 101,
            table: '1번 테이블',
            time: '25분 전',
            status: 'DONE',
            payType: 'QR 토스페이',
            totalPrice: '18,000원',
            items: [
                { name: '비빔냉면', qty: 2 }
            ]
        }
    ];

    let currentFilter = 'ALL';

    // 탭 전환 핸들러
    function switchTab(status) {
        currentFilter = status;
        
        // 탭 스타일 활성화/비활성화
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.className = 'tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all text-toss-gray hover:text-toss-dark';
        });

        const activeBtn = document.getElementById(`tab-${status}`);
        if (activeBtn) {
            activeBtn.className = 'tab-btn flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl font-bold text-sm transition-all bg-white text-toss-dark shadow-sm';
        }

        renderOrders();
    }

    // 상태 변경 액션 (수락, 서빙완료, 취소 등)
    function changeOrderStatus(orderId, newStatus, btnElement) {
        const card = btnElement.closest('.order-card');
        
        if (card) {
            // 부드러운 퇴장 효과
            card.style.transform = 'scale(0.97)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                const target = orders.find(o => o.id === orderId);
                if (target) {
                    if (newStatus === 'CANCEL') {
                        orders = orders.filter(o => o.id !== orderId);
                    } else {
                        target.status = newStatus;
                    }
                }
                updateBadgesAndKPI();
                renderOrders();
            }, 200);
        }
    }

    // 상태별 배지 렌더링 헬퍼
    function getStatusBadge(status) {
        switch(status) {
            case 'NEW':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightBlue text-toss-blue">신규 주문</span>';
            case 'COOKING':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightOrange text-toss-orange">조리 중</span>';
            case 'DONE':
                return '<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-toss-lightGreen text-toss-green">서빙 완료</span>';
        }
    }

    // 상태별 액션 버튼 렌더링 헬퍼
    function getActionButtons(order) {
        if (order.status === 'NEW') {
            return `
                <button onclick="changeOrderStatus(${order.id}, 'COOKING', this)" class="flex-1 px-5 py-3 rounded-2xl bg-toss-blue hover:bg-toss-hoverBlue active:scale-95 text-white font-semibold text-sm transition-all shadow-sm shadow-toss-blue/20">
                    주문 수락
                </button>
                <button onclick="changeOrderStatus(${order.id}, 'CANCEL', this)" class="px-5 py-3 rounded-2xl bg-toss-lightGray hover:bg-slate-200 active:scale-95 text-toss-gray hover:text-toss-dark font-medium text-sm transition-all">
                    거절/취소
                </button>
            `;
        } else if (order.status === 'COOKING') {
            return `
                <button onclick="changeOrderStatus(${order.id}, 'DONE', this)" class="flex-1 px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-sm transition-all shadow-sm shadow-emerald-600/20">
                    조리 완료
                </button>
            `;
        } else {
            return `
                <button class="px-5 py-3 rounded-2xl bg-toss-lightGray text-toss-gray font-medium text-sm cursor-default">
                    처리 완료됨
                </button>
            `;
        }
    }

    // 주문 카드 렌더링
    function renderOrders() {
        const container = document.getElementById('order-container');
        const emptyState = document.getElementById('empty-state');

        const filtered = orders.filter(order => {
            if (currentFilter === 'ALL') return true;
            return order.status === currentFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');

        container.innerHTML = filtered.map(order => `
            <div class="order-card bg-white rounded-3xl p-6 border border-toss-border/70 shadow-sm transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-6" data-id="${order.id}">
                <div class="flex-1 space-y-3">
                    <div class="flex items-center gap-3">
                        ${getStatusBadge(order.status)}
                        <span class="text-xs font-bold text-toss-gray">#${order.id}</span>
                        <span class="text-sm font-medium text-toss-gray">${order.time}</span>
                    </div>

                    <h4 class="text-2xl font-bold text-toss-dark tracking-tight">
                        ${order.table}
                    </h4>

                    <div class="p-4 bg-toss-bg rounded-2xl space-y-2 border border-slate-100">
                        ${order.items.map(item => `
                            <div class="flex justify-between items-center text-sm font-medium text-toss-dark">
                                <span>${item.name}</span>
                                <span class="font-bold text-toss-blue bg-white px-2 py-0.5 rounded-md border border-slate-200">${item.qty}개</span>
                            </div>
                        `).join('')}
                        <div class="pt-2 mt-2 border-t border-slate-200 flex justify-between items-center text-xs text-toss-gray">
                            <span>결제 완료 (${order.payType})</span>
                            <span class="font-bold text-sm text-toss-dark">${order.totalPrice}</span>
                        </div>
                    </div>
                </div>

                <div class="flex md:flex-col gap-2.5 sm:min-w-[140px] shrink-0">
                    ${getActionButtons(order)}
                </div>
            </div>
        `).join('');
    }

    // 배지 카운트 및 상단 KPI 동기화
    function updateBadgesAndKPI() {
        const countAll = orders.length;
        const countNew = orders.filter(o => o.status === 'NEW').length;
        const countCooking = orders.filter(o => o.status === 'COOKING').length;
        const countDone = orders.filter(o => o.status === 'DONE').length;

        // KPI
        document.getElementById('kpi-total').innerText = `${countAll}건`;
        document.getElementById('kpi-new').innerText = `${countNew}건`;
        document.getElementById('kpi-cooking').innerText = `${countCooking}건`;
        document.getElementById('kpi-done').innerText = `${countDone}건`;

        // 탭 배지
        document.getElementById('badge-all').innerText = countAll;
        document.getElementById('badge-new').innerText = countNew;
        document.getElementById('badge-cooking').innerText = countCooking;
        document.getElementById('badge-done').innerText = countDone;

        // 사이드바 알림
        document.getElementById('nav-new-badge').innerText = countNew;

        // 안내 문구
        document.getElementById('header-status-text').innerText = countNew > 0 
            ? `신규 주문이 ${countNew}건 대기 중입니다.` 
            : '대기 중인 신규 주문이 없습니다.';
    }

    // 초기 실행
    updateBadgesAndKPI();
    renderOrders();
</script>

</body>
</html>
